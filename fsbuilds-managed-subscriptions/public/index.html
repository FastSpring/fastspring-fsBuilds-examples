<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plans</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />

  <!-- Static script tag, present from the initial HTML parse - see
       fastspring-init.js for why this must be static, never JS-injected.
       {{STOREFRONT_URL}} / {{SBL_SCRIPT_URL}} are replaced by
       server/index.js from .env before this page is sent. -->
  <script
      id="fsc-api"
      src="{{SBL_SCRIPT_URL}}"
      type="text/javascript"
      data-storefront="{{STOREFRONT_URL}}"
      data-continuous="true"
      data-data-callback="dataCallback"
      data-error-callback="fsErrorCallback"
      data-debug="true">
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container header-row">
      <div class="brand-name" data-brand-name>Store</div>
    </div>
  </header>

  <section class="pricing-hero">
    <div class="container">
      <h1 class="pricing-hero-headline">Pick a plan.<br>Work in sync.</h1>
      <p class="pricing-hero-sub">Everything your team needs to manage, publish, and grow — in one place.</p>
    </div>
  </section>

  <main class="container">
    <h2 class="page-heading" id="page-heading"></h2>
    <div id="product-grid" class="product-grid">
      <!-- Cards injected by render-storefront.js -->
    </div>
  </main>

  <script src="../config/store.config.js"></script>
  <script src="js/apply-brand.js"></script>
  <script src="js/fastspring-init.js"></script>
  <script src="js/subscribe-actions.js"></script>
  <script src="js/render-storefront.js"></script>
</body>
</html>
