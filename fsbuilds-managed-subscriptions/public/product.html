<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />

  <script
      id="fsc-api"
      src="{{SBL_SCRIPT_URL}}"
      type="text/javascript"
      data-storefront="{{STOREFRONT_URL}}"
      data-continuous="true"
      data-data-callback="dataCallback"
      data-error-callback="fsErrorCallback"
      data-debug="true">
  </script>
</head>
<body class="page-product">
  <header class="site-header">
    <div class="container header-row">
      <div>
        <div class="brand-name" data-brand-name>Store</div>
        <div class="brand-tagline" data-brand-tagline></div>
      </div>
    </div>
  </header>

  <main class="container">
    <a class="back-link" href="index.html">&larr; Back to plans</a>
    <div id="product-detail" class="product-detail">
      <!-- Injected by render-product.js -->
    </div>
  </main>

  <script src="../config/store.config.js"></script>
  <script src="js/apply-brand.js"></script>
  <script src="js/fastspring-init.js"></script>
  <script src="js/subscribe-actions.js"></script>
  <script src="js/render-product.js"></script>
</body>
</html>
